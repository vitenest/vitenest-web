<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vitenest</title>
  </head>
  <body>
    <script>
      window.addEventListener('error', function(e) {
        var msg = e.message || (e.target && e.target.src ? 'Failed to load: ' + e.target.src : 'Unknown error');
        document.body.innerHTML += '<div style="color:red;font-size:20px;padding:20px;z-index:9999;position:fixed;top:0;left:0;background:white;">Error: ' + msg + '</div>';
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML += '<div style="color:red;font-size:20px;padding:20px;z-index:9999;position:fixed;top:0;left:0;background:white;">Unhandled Promise: ' + (e.reason ? e.reason.toString() : 'Unknown rejection') + '</div>';
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
